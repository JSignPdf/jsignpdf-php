version: 2
updates:
  # Maintain dependencies for Composer
  - package-ecosystem: "composer" # See documentation for possible values
    directories:
      - "/"
      - "/vendor-bin/coding-standard"
      - "/vendor-bin/phpunit"
      - "/vendor-bin/psalm"
    schedule:
      interval: "daily"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily
